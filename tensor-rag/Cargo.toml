[package]
name = "tensor-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1", features = ["v4"] }
bytes = "1.11.1"
ndarray = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.12.3"
lexpr = "0.2.7"
arrow = "53.0.0"
flatbuffers = "2.0.8"
qdrant-client = "1.13.0"
tokio-util = { version = "0.7.18", features = ["full"] }
wgpu = "29.0.3"
bytemuck = "1.25.0"
axum = { version = "0.7", features = ["multipart"] }
prometheus = { version = "0.13", features = ["process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arrow-flight = "53.0.0"
futures = "0.3"
tokio-stream = { version = "0.1.18", features = ["sync"] }
dotenvy = "0.15"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
chunkedrs = "1.0.3"
regex = "1"
once_cell = "1"
rust-stemmers = "1.2.0"


[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "zero_copy"
harness = false

[[bench]]
name = "colbert"
harness = false

[[bench]]
name = "stress"
harness = false

[[bin]]
name = "vm_worker"
path = "src/bin/vm_worker.rs"

[dependencies.bincode]
version = "1.3"
