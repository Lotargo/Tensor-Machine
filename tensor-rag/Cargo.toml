[package]
name = "tensor-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1", features = ["v4"] }
bytes = "1.11.1"
ndarray = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.14.6"
lexpr = "0.2.7"
arrow = "51.0.0"
flatbuffers = "2.0.8"
qdrant-client = "1.13.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "zero_copy"
harness = false
