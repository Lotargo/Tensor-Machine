version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tensor_postgres
    restart: always
    environment:
      POSTGRES_DB: tensor_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tensor_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: tensor_ollama
    restart: always
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-1024}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: curlimages/curl:latest
    container_name: tensor_ollama_pull
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
      until curl -s http://ollama:11434/api/tags >/dev/null; do echo 'Waiting for Ollama...'; sleep 2; done;
      echo 'Pulling jeffh/intfloat-multilingual-e5-large-instruct:q8_0 model...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"jeffh/intfloat-multilingual-e5-large-instruct:q8_0\"}';
      echo 'Model pulled successfully.';
      "

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
