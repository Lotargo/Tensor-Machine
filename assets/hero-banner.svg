<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!-- Dynamic Background -->
  <defs>
    <!-- Deep premium black background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle elegant silver glow in the center -->
    <radialGradient id="silverGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <!-- Platinum gradient for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>

    <filter id="blurBlock">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
  </defs>

  <!-- Base Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#silverGlow)" />

  <!-- Abstract Elegance / Premium Data Geometry Layer -->
  <!-- We'll use rotating geometric rings and nodes -->
  <g opacity="0.4" stroke="#404040" stroke-width="0.5" fill="none">
    <circle cx="600" cy="200" r="300" stroke-dasharray="10 5" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="0 600 200" to="360 600 200" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="200" r="280" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360 600 200" to="0 600 200" dur="45s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="200" r="260" stroke-dasharray="2 8" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0 600 200" to="360 600 200" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle connecting lines and nodes for the background representing vector structure -->
  <g stroke="#2b2b2b" stroke-width="1" opacity="0.6">
    <!-- Left side -->
    <circle cx="150" cy="100" r="1.5" fill="#ffffff" />
    <circle cx="300" cy="250" r="1.5" fill="#a0a0a0" />
    <line x1="150" y1="100" x2="300" y2="250" />

    <circle cx="200" cy="350" r="1.5" fill="#ffffff" />
    <line x1="300" y1="250" x2="200" y2="350" />

    <!-- Right side -->
    <circle cx="1050" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="900" cy="220" r="1.5" fill="#a0a0a0" />
    <line x1="1050" y1="120" x2="900" y2="220" />

    <circle cx="980" cy="340" r="1.5" fill="#ffffff" />
    <line x1="900" y1="220" x2="980" y2="340" />
  </g>

  <!-- Animated subtle pulse in the center behind text -->
  <circle cx="600" cy="200" r="5" fill="#ffffff" opacity="0.0">
    <animate attributeName="r" values="0; 200" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1; 0; 0" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Text Section -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" font-size="64" fill="url(#textGrad)" letter-spacing="4">
    TENSOR MACHINE
  </text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#7d7d7d" letter-spacing="6">
    RUST • TENSOR VM • GPU-ACCELERATED
  </text>

  <!-- Elegant accent line -->
  <rect x="550" y="270" width="100" height="2" fill="#ffffff" opacity="0.5" />
</svg>